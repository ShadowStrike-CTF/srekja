<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sreḱa v0.4.1</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #9b59f5;
    --accent-hover: #ae78f7;
    --purple-dim: rgba(155, 89, 245, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4;
    min-height: 100vh;
  }
  main {
    max-width: 440px;
    margin: 0 auto;
    padding: 32px 16px 48px;
  }
  h1 { margin: 0 0 4px; font-size: 28px; color: var(--accent); }
  .tag { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label, .field-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  select, input[type=number] {
    width: 100%;
    font-size: 16px;
    padding: 10px 12px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  select:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rule { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .avail {
    display: inline-block;
    margin: 8px 0 0;
    padding: 2px 10px;
    font-size: 12px;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .notes { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .notes[hidden] { display: none; }
  button {
    width: 100%;
    margin-top: 16px;
    font-size: 17px;
    font-weight: 600;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled, button:disabled:hover { background: var(--border); color: var(--muted); cursor: not-allowed; }

  .lines { margin-top: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    width: auto;
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--muted);
    background: var(--panel);
    color: var(--muted);
  }
  .chip:hover { background: var(--panel); border-color: var(--accent); }
  .chip.selected { border-color: var(--accent); background: var(--purple-dim); color: var(--text); }
  .custom { margin-top: 10px; }
  .custom[hidden] { display: none; }

  .empty { color: var(--muted); font-size: 14px; text-align: center; margin: 8px 0; }
  .supp-note { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  .row-label { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .balls { display: flex; flex-wrap: wrap; gap: 8px; }
  .extra-block { margin-top: 12px; }
  .line + .line { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .line-letter { font-size: 15px; font-weight: 700; color: var(--accent); margin: 0 0 8px; }
  .ball {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700;
    border: 2px solid var(--accent);
    color: var(--text);
  }
  .ball.extra { background: var(--accent); color: #fff; }

  .copy-btn {
    margin: 0 0 16px;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
  }
  .copy-btn:hover { background: var(--purple-dim); }
  .copy-btn[hidden] { display: none; }

  .entry-wrap { margin-top: 16px; }
  .entry-wrap[hidden], .sys-wrap[hidden] { display: none; }
  .sys-wrap { margin-top: 10px; }
  .summary {
    margin: 12px 0 0;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text);
    background: var(--purple-dim);
    border-radius: 8px;
  }
  .summary[hidden] { display: none; }
  .min-msg { margin: 8px 0 0; font-size: 13px; font-weight: 600; color: var(--accent-hover); }
  .min-msg[hidden] { display: none; }
  .all-pill {
    display: inline-flex; align-items: center;
    height: 44px; padding: 0 16px;
    border-radius: 999px;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 700;
  }

  footer { font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>

<main>
  <h1>Sreḱa</h1>
  <p class="tag">Lotto number picker · prototype v0.4.1</p>

  <section class="panel">
    <label for="game">Game</label>
    <select id="game"></select>
    <p class="rule" id="rule"></p>
    <span class="avail" id="avail"></span>
    <p class="notes" id="notes" hidden></p>

    <div class="entry-wrap" id="entry-wrap" hidden>
      <label for="entry">Entry type</label>
      <select id="entry"></select>
      <div class="sys-wrap" id="sys-wrap" hidden>
        <label for="sys" id="sys-label">Size</label>
        <select id="sys"></select>
      </div>
    </div>

    <div class="lines">
      <span class="field-label" id="lines-label">Lines</span>
      <div class="chips" id="chips" role="group" aria-labelledby="lines-label"></div>
      <div class="custom" id="custom-wrap" hidden>
        <label for="custom" id="custom-label">Number of lines (1–50)</label>
        <input id="custom" type="number" min="1" max="50" step="1" value="1" inputmode="numeric">
      </div>
    </div>

    <p class="summary" id="summary" hidden></p>
    <p class="min-msg" id="min-msg" hidden></p>

    <button id="pick" type="button">Generate</button>
  </section>

  <section class="panel" id="output" aria-live="polite">
    <p class="empty">Choose a game and press “Generate”.</p>
  </section>

  <button id="copy" class="copy-btn" type="button" hidden>Copy all</button>

  <footer>Random picks only — no number is more likely to win than any other.<br>18+ only · Not affiliated with any lottery operator.<br>Gambling Help: 1800 858 858</footer>
</main>

  var AVAILABILITY_TEXT = {

  // ===========================================================================
  // PURE HELPERS (no DOM) — exposed on window.SREKJA for tests.
  // ===========================================================================

  // Exact n choose k. Multiplicative form: after step i the running value is
  // C(n-k+i, i), always an integer, so every division is exact.
  function choose(n, k) {
    if (k < 0 || k > n) return 0;
    if (k > n - k) k = n - k;
    var r = 1;
    for (var i = 1; i <= k; i++) {
      r = (r * (n - k + i)) / i;
      if (!Number.isSafeInteger(r)) throw new Error("choose overflow");
    }
    return r;
  }

  function fmt(n) { return n.toLocaleString("en-AU"); }

  function cents(x) { return Math.round(x * 100); }

  function formatMoney(currency, c) {
    return CURRENCY_SYMBOL[currency] + (c / 100).toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function findEntryType(g, id) {
    for (var i = 0; i < g.entryTypes.length; i++) if (g.entryTypes[i].id === id) return g.entryTypes[i];
    return null;
  }

  // Size options for a system-tab entry type, in Lott order: Pick entries first, then System sizes.
  // Each option: { code: "p5" | "s8", label }
  function sizeOptions(g, typeId) {
    var et = findEntryType(g, typeId);
    var opts = [];
    if (!et) return opts;
    (et.picks || []).slice().sort(function (a, b) { return a - b; }).forEach(function (n) {
      var sp = entrySpec(g, typeId, "p" + n);
      opts.push({ code: "p" + n, label: "Pick " + n + " — " + fmt(sp.games) + (sp.games === 1 ? " game" : " games") });
    });
    for (var s = et.min; s <= et.max; s++) {
      var ss = entrySpec(g, typeId, "s" + s);
      opts.push({ code: "s" + s, label: "System " + s + " — " + fmt(ss.games) + " games" });
    }
    return opts;
  }

  // Describe one entry. typeId: "standard" | "powerhit" | "system" | "phsystem"; sizeCode "p5"/"s8".
  function entrySpec(g, typeId, sizeCode) {
    if (typeId === "powerhit") {
      return { type: "powerhit", kind: "powerhit", chosen: g.mainPick, size: null, games: g.extraMax, name: "PowerHit" };
    }
    if (typeId === "system" || typeId === "phsystem") {
      var n = parseInt(String(sizeCode).slice(1), 10);
      if (typeId === "system" && String(sizeCode).charAt(0) === "p") {
        return { type: "system", kind: "pick", chosen: n, size: n, any: g.mainPick - n,
                 games: choose(g.mainMax - n, g.mainPick - n), name: "Pick " + n };
      }
      if (typeId === "phsystem") {
        return { type: "phsystem", kind: "phsystem", chosen: n, size: n,
                 games: choose(n, g.mainPick) * g.extraMax, name: "PowerHit System " + n };
      }
      return { type: "system", kind: "system", chosen: n, size: n, games: choose(n, g.mainPick), name: "System " + n };
    }
    return { type: "standard", kind: "standard", chosen: g.mainPick, size: null, games: 1, name: "Standard" };
  }

  // Division 1 combinations for ONE game.
  function perGameOdds(g) {
    var c = choose(g.mainMax, g.mainPick);
    if (g.extraName && g.extraMax) c *= choose(g.extraMax, g.extraPick);
    return c;
  }

  // Cost of `count` entries (standard: count = number of games).
  // Returns { cents, exact }. exact=false → show "≈ … (check your cart)".
  function costFor(g, spec, count) {
    var pp = g.pricePoints || {};
    if (spec.kind === "standard") {
      if (pp.standard && pp.standard[count] !== undefined && g.priceVerified) return { cents: cents(pp.standard[count]), exact: true };
      if (g.linear) return { cents: count * cents(g.pricePerGame), exact: !!g.priceVerified };
      return { cents: cents(count * g.effectivePerGame), exact: false };
    }
    var point;
    if (spec.kind === "powerhit") point = pp.powerhit;
    else if (spec.kind === "pick") point = pp.pick && pp.pick[spec.size];
    else if (spec.kind === "system") point = pp.system && pp.system[spec.size];
    else if (spec.kind === "phsystem") point = pp.phsystem && pp.phsystem[spec.size];
    if (point !== undefined && g.priceVerified) return { cents: count * cents(point), exact: true };
    if (g.linear) return { cents: count * spec.games * cents(g.pricePerGame), exact: !!g.priceVerified };
    // Fallback: one entry estimated at games × effectivePerGame, then × count (entry price is linear).
    return { cents: count * cents(spec.games * g.effectivePerGame), exact: false };
  }

  // Division 1 odds for `totalGames` games in one draw (and per round for multi-round games).
  function oddsFor(g, totalGames) {
    var per = perGameOdds(g);
    var res = { perGame: per, oneIn: Math.round(per / totalGames) };
    if (g.rounds > 1) {
      var p = totalGames / per;
      res.perDrawAllRoundsOneIn = Math.round(1 / (1 - Math.pow(1 - p, g.rounds)));
    }
    return res;
  }

  function minGamesBlocks(g, spec, count) {
    return spec.kind === "standard" && count < g.minGames;
  }

  // ===========================================================================
  // RANDOMNESS — LOCKED. crypto.getRandomValues + rejection sampling only.
  // ===========================================================================

  // Unbiased random integer in [0, n) using the browser's crypto RNG.
  function randInt(n) {
    var buf = new Uint32Array(1);
    var limit = Math.floor(0x100000000 / n) * n; // reject the uneven tail
    var x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return x % n;
  }

  // `count` unique numbers from 1..max in DRAW ORDER (partial Fisher–Yates).
  function drawUnique(max, count) {
    var pool = [];
    for (var i = 1; i <= max; i++) pool.push(i);
    for (var j = 0; j < count; j++) {
      var k = j + randInt(max - j);
      var t = pool[j]; pool[j] = pool[k]; pool[k] = t;
    }
    return pool.slice(0, count);
  }

  // `count` unique numbers from 1..max, sorted ascending (same as v0.1).
  function pickUnique(max, count) {
    return drawUnique(max, count).sort(function (a, b) { return a - b; });
  }

  // One line: { main, second, kind: "extra" | "all" | null, any }
  // Supplementaries are operator-drawn, so they are never generated (v0.4.1).
  function drawLine(g, spec) {
    if (spec.kind === "powerhit" || spec.kind === "phsystem") {
      // Every ball 1..extraMax is covered — nothing to draw from the second barrel.
      return { main: pickUnique(g.mainMax, spec.chosen), second: [], kind: "all", any: 0 };
    }
    if (spec.kind === "system" || spec.kind === "pick") {
      var any = spec.kind === "pick" ? spec.any : 0;
      var main = pickUnique(g.mainMax, spec.chosen);
      if (g.extraName) return { main: main, second: pickUnique(g.extraMax, g.extraPick), kind: "extra", any: any };
      return { main: main, second: [], kind: null, any: any };
    }
    if (g.extraName) {
      return { main: pickUnique(g.mainMax, g.mainPick), second: pickUnique(g.extraMax, g.extraPick), kind: "extra", any: 0 };
    }
    return { main: pickUnique(g.mainMax, g.mainPick), second: [], kind: null, any: 0 };
  }

  function lineKey(l) {
    return l.main.join(",") + "|" + l.second.join(",");
  }

  // n lines, no two identical (main + supps/extras combined).
  function drawLines(g, spec, n) {
    var seen = {};
    var lines = [];
    for (var i = 0; i < n; i++) {
      var l, tries = 0;
      do { l = drawLine(g, spec); tries++; } while (seen[lineKey(l)] && tries < 1000);
      seen[lineKey(l)] = true;
      lines.push(l);
    }
    return lines;
  }

  function extraLabel(g) {
    return g.extraPick > 1 ? g.extraPlural : g.extraName;
  }

  function ruleText(g) {
    var s = g.mainPick + " from 1–" + g.mainMax;
    if (g.suppPick) {
      s += " (+ " + g.suppPick + " supplementaries)";
    } else if (g.extraName) {
      s += " + " + g.extraPick + " " + extraLabel(g) + " from 1–" + g.extraMax;
    }
    if (g.extraDisplayOnly) s += " (+ " + g.extraDisplayOnly + " drawn by the operator)";
    return s + " · " + g.drawDays;
  }

  // A, B … Z, AA, AB … (bijective base-26).
  function lineLabel(i) {
    var s = "";
    i += 1;
    while (i > 0) {
      var r = (i - 1) % 26;
      s = String.fromCharCode(65 + r) + s;
      i = Math.floor((i - 1) / 26);
    }
    return s;
  }

  function entryDescription(g, spec) {
    var plusExtra = g.extraName ? " + 1 " + g.extraName : "";
    if (spec.kind === "powerhit") return "PowerHit: " + g.mainPick + " main numbers, all " + g.extraMax + " " + g.extraName + "s covered.";
    if (spec.kind === "phsystem") return "PowerHit System " + spec.size + ": " + spec.size + " main numbers, every combination × all " + g.extraMax + " " + g.extraName + "s.";
    if (spec.kind === "system") return "System " + spec.size + ": " + spec.size + " main numbers" + plusExtra + ", every " + g.mainPick + "-number combination played.";
    if (spec.kind === "pick") return "Pick " + spec.size + ": you choose " + spec.size + " numbers" + plusExtra + "; the other " + spec.any + " " + (spec.any === 1 ? "is" : "are") + " covered by every remaining number.";
    if (g.extraName) return "Standard: " + g.mainPick + " main numbers + " + g.extraPick + " " + extraLabel(g) + " per game.";
    return "Standard: " + g.mainPick + " main numbers per game.";
  }

  function summaryText(g, spec, count) {
    var total = spec.games * count;
    var cost = costFor(g, spec, count);
    var money = formatMoney(g.currency, cost.cents);
    var costText = cost.exact ? money : "≈ " + money + " (check your cart)";
    var odds = oddsFor(g, total);
    var oddsText;
    if (g.rounds > 1) {
      oddsText = "Division 1 ≈ 1 in " + fmt(odds.oneIn) + " per round (" + g.rounds + " rounds per draw: ≈ 1 in " +
        fmt(odds.perDrawAllRoundsOneIn) + " per draw) · per round 1 in " + fmt(odds.perGame) + " per game";
    } else {
      oddsText = "Division 1 ≈ 1 in " + fmt(odds.oneIn) + (g.drawsPerEntry > 1 ? " per draw" : "");
    }
    var s = entryDescription(g, spec) + " " + fmt(spec.games) + (spec.games === 1 ? " game" : " games") + " per entry · " +
      fmt(total) + (total === 1 ? " game" : " games") + " total · " + costText + " · " + oddsText + ".";
    if (g.drawsPerEntry > 1) s += " Each game plays " + g.drawsPerEntry + " daily draws.";
    if (g.rounds > 1) s += " Each line plays two rounds per draw.";
    if (g.linear && spec.kind === "standard" && g.id === "eurojackpot") s += " Plus order fee.";
    return s;
  }

  // Shown under the results for games whose draw includes supplementaries.
  function suppNoteText(g) {
    if (!g.suppPick) return "";
    return "The draw also includes " + g.suppPick + " supplementary numbers — you don't pick these.";
  }

  function lineCopyText(g, spec, l, i) {
    var tag = spec.kind === "standard" ? "" : " [" + spec.name + "]";
    var s = lineLabel(i) + tag + ": " + l.main.join(" ");
    if (l.any) s += " + any " + l.any;
    if (l.kind === "extra") s += " | " + extraLabel(g) + ": " + l.second.join(" ");
    else if (l.kind === "all") s += " | " + extraLabel(g) + ": ALL";
    return s;
  }

  // ===========================================================================
  // UI
  // ===========================================================================
  var select = document.getElementById("game");
  var rule = document.getElementById("rule");
  var availEl = document.getElementById("avail");
  var notesEl = document.getElementById("notes");
  var chipsEl = document.getElementById("chips");
  var customWrap = document.getElementById("custom-wrap");
  var customInput = document.getElementById("custom");
  var customLabel = document.getElementById("custom-label");
  var btn = document.getElementById("pick");
  var out = document.getElementById("output");
  var copyBtn = document.getElementById("copy");
  var entryWrap = document.getElementById("entry-wrap");
  var entrySelect = document.getElementById("entry");
  var sysWrap = document.getElementById("sys-wrap");
  var sysSelect = document.getElementById("sys");
  var summary = document.getElementById("summary");
  var minMsg = document.getElementById("min-msg");
  var linesLabel = document.getElementById("lines-label");

  var ENTRY_LABEL = { standard: "Standard", powerhit: "PowerHit", system: "System", phsystem: "PowerHit System" };

  var selectedChip = 1;      // a preset number, or "custom"
  var picked = false;
  var lastLines = null;
  var lastGame = null;
  var lastSpec = null;
  var copyTimer = null;

  GAMES.forEach(function (g, i) {
    var o = document.createElement("option");
    o.value = i;
    o.textContent = g.name;
    select.appendChild(o);
  });

  var chipButtons = [];
  PRESETS.concat(["custom"]).forEach(function (v) {
    var c = document.createElement("button");
    c.type = "button";
    c.className = "chip";
    c.textContent = v === "custom" ? "Custom" : String(v);
    c.addEventListener("click", function () { selectChip(v); });
    chipButtons.push({ value: v, el: c });
    chipsEl.appendChild(c);
  });

  function currentGame() { return GAMES[select.value]; }

  function currentSpec() {
    var g = currentGame();
    var t = entrySelect.value || "standard";
    if (!findEntryType(g, t)) t = "standard";
    return entrySpec(g, t, sysSelect.value);
  }

  function lineCount() {
    if (selectedChip !== "custom") return selectedChip;
    var n = parseInt(customInput.value, 10);
    if (isNaN(n) || n < 1) n = 1;
    if (n > MAX_LINES) n = MAX_LINES;
    return n;
  }

  function fillSizes() {
    var g = currentGame();
    var t = entrySelect.value;
    sysSelect.innerHTML = "";
    if (t !== "system" && t !== "phsystem") { sysWrap.hidden = true; return; }
    var opts = sizeOptions(g, t);
    var firstSystem = null;
    opts.forEach(function (o) {
      var el = document.createElement("option");
      el.value = o.code;
      el.textContent = o.label;
      sysSelect.appendChild(el);
      if (!firstSystem && o.code.charAt(0) === "s") firstSystem = o.code;
    });
    sysSelect.value = firstSystem || opts[0].code;
    sysWrap.hidden = false;
  }

  function updateSummary() {
    var g = currentGame();
    var spec = currentSpec();
    var n = lineCount();
    summary.textContent = summaryText(g, spec, n);
    summary.hidden = false;
    var blocked = minGamesBlocks(g, spec, n);
    minMsg.hidden = !blocked;
    minMsg.textContent = blocked ? "Minimum entry is " + g.minGames + " games." : "";
    btn.disabled = blocked;
  }

  function updateButton() {
    var spec = currentSpec();
    var unit = spec.kind === "standard" ? "lines" : "entries";
    linesLabel.textContent = unit === "lines" ? "Lines" : "Entries";
    customLabel.textContent = "Number of " + unit + " (1–" + MAX_LINES + ")";
    updateSummary();
    if (picked) { btn.textContent = "Generate again"; return; }
    var n = lineCount();
    btn.textContent = n === 1 ? "Generate" : "Generate " + n + " " + unit;
  }

  function emptyOutput(text) {
    out.innerHTML = '<p class="empty"></p>';
    out.firstChild.textContent = text;
  }

  function setCount(n) {
    if (PRESETS.indexOf(n) >= 0) { selectChip(n); return; }
    customInput.value = n;
    selectChip("custom", true);
  }

  function onEntryChange() {
    fillSizes();
    lastLines = null;
    picked = false;
    emptyOutput("Press “Generate” for " + currentSpec().name + ".");
    hideCopy();
    var g = currentGame();
    setCount(currentSpec().kind === "standard" ? g.minGames : 1);
  }

  function onSizeChange() {
    lastLines = null;
    picked = false;
    emptyOutput("Press “Generate” for " + currentSpec().name + ".");
    hideCopy();
    updateButton();
  }

  function selectChip(v, noFocus) {
    selectedChip = v;
    chipButtons.forEach(function (c) {
      var on = c.value === v;
      c.el.classList.toggle("selected", on);
      c.el.setAttribute("aria-pressed", on ? "true" : "false");
    });
    customWrap.hidden = v !== "custom";
    if (v === "custom" && !noFocus) customInput.focus();
    picked = false;
    updateButton();
  }

  function ballRow(label, nums, cls, wrapClass, pillText) {
    var wrap = document.createElement("div");
    if (wrapClass) wrap.className = wrapClass;
    var p = document.createElement("p");
    p.className = "row-label";
    p.textContent = label;
    var row = document.createElement("div");
    row.className = "balls";
    nums.forEach(function (n) {
      var b = document.createElement("div");
      b.className = cls;
      b.textContent = n;
      row.appendChild(b);
    });
    if (pillText) {
      var pill = document.createElement("span");
      pill.className = "all-pill any-pill";
      pill.textContent = pillText;
      row.appendChild(pill);
    }
    wrap.appendChild(p);
    wrap.appendChild(row);
    return wrap;
  }

  function hideCopy() {
    copyBtn.hidden = true;
    clearTimeout(copyTimer);
    copyBtn.textContent = "Copy all";
  }

  function resetOutput() {
    var g = currentGame();
    rule.textContent = ruleText(g);
    availEl.textContent = AVAILABILITY_TEXT[g.availability];
    notesEl.textContent = g.notes.join(" ");
    notesEl.hidden = g.notes.length === 0;
    entrySelect.innerHTML = "";
    g.entryTypes.forEach(function (et) {
      var o = document.createElement("option");
      o.value = et.id;
      o.textContent = ENTRY_LABEL[et.id];
      entrySelect.appendChild(o);
    });
    entrySelect.value = "standard";
    entryWrap.hidden = g.entryTypes.length < 2;
    fillSizes();
    lastLines = null;
    picked = false;
    emptyOutput("Press “Generate” for " + g.name + ".");
    hideCopy();
    setCount(g.minGames);
  }

  function pick() {
    var g = currentGame();
    var spec = currentSpec();
    var n = lineCount();
    if (minGamesBlocks(g, spec, n)) return;
    var lines = drawLines(g, spec, n);
    out.innerHTML = "";
    lines.forEach(function (l, i) {
      var block = document.createElement("div");
      block.className = "line";
      var letter = document.createElement("p");
      letter.className = "line-letter";
      letter.textContent = lineLabel(i) + (spec.kind === "standard" ? "" : " · " + spec.name);
      block.appendChild(letter);
      var mainLabel = l.main.length !== g.mainPick ? "Main numbers (" + l.main.length + ")" : "Main numbers";
      block.appendChild(ballRow(mainLabel, l.main, "ball", null, l.any ? "+ any " + l.any + " of the rest" : null));
      if (l.kind === "extra") {
        block.appendChild(ballRow(extraLabel(g), l.second, "ball extra", "extra-block"));
      } else if (l.kind === "all") {
        var wrap = document.createElement("div");
        wrap.className = "extra-block";
        var p = document.createElement("p");
        p.className = "row-label";
        p.textContent = extraLabel(g);
        var pill = document.createElement("span");
        pill.className = "all-pill";
        pill.textContent = "ALL 1–" + g.extraMax;
        wrap.appendChild(p);
        wrap.appendChild(pill);
        block.appendChild(wrap);
      }
      out.appendChild(block);
    });
    var note = suppNoteText(g);
    if (note) {
      var np = document.createElement("p");
      np.className = "supp-note";
      np.id = "supp-note";
      np.textContent = note;
      out.appendChild(np);
    }
    lastLines = lines;
    lastGame = g;
    lastSpec = spec;
    picked = true;
    updateButton();
    hideCopy();
    copyBtn.hidden = false;
  }

  function clipboardText() {
    return lastLines.map(function (l, i) { return lineCopyText(lastGame, lastSpec, l, i); }).join("\n");
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function showCopied() {
    copyBtn.textContent = "Copied ✓";
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () { copyBtn.textContent = "Copy all"; }, 1500);
  }

  function copyAll() {
    if (!lastLines) return;
    var text = clipboardText();
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(showCopied, function () {
        if (fallbackCopy(text)) showCopied();
      });
    } else if (fallbackCopy(text)) {
      showCopied();
    }
  }

  select.addEventListener("change", resetOutput);
  entrySelect.addEventListener("change", onEntryChange);
  sysSelect.addEventListener("change", onSizeChange);
  customInput.addEventListener("input", function () { picked = false; updateButton(); });
  customInput.addEventListener("change", function () { customInput.value = lineCount(); updateButton(); });
  btn.addEventListener("click", pick);
  copyBtn.addEventListener("click", copyAll);
  resetOutput();

  // Test hook (read-only helpers; no network, no storage).
  window.SREKJA = {
    GAMES: GAMES, QP_PACKAGES: QP_PACKAGES, choose: choose, entrySpec: entrySpec, sizeOptions: sizeOptions,
    perGameOdds: perGameOdds, costFor: costFor, oddsFor: oddsFor, formatMoney: formatMoney,
    summaryText: summaryText, lineCopyText: lineCopyText, suppNoteText: suppNoteText, drawLines: drawLines, pickUnique: pickUnique,
    minGamesBlocks: minGamesBlocks, clipboardText: function () { return lastLines ? clipboardText() : ""; }
  };
</script>
</body>
</html>
