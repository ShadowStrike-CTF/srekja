[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "srekja"
version = "0.0.1"
description = "Lotto number picker for AU and international lotteries. by ShadowStrike."
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "ShadowStrike", email = "r@strategos.au"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

[project.urls]
"Source" = "https://github.com/ShadowStrike-CTF/srekja"

[tool.hatch.build.targets.wheel]
packages = ["src/srekja"]

# Internal and development files never ship in the sdist, even if the .gitignore guard is missing.
[tool.hatch.build.targets.sdist]
exclude = [
  "TEMPLATE_GUIDE.md",
  "CLAUDE.md",
  "CLAUDE.local.md",
  "srekja_prototype_*.html",
  "tests",
  "tests/screenshots",
  "tests/results_*.txt",
]
